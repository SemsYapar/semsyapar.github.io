<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'tr' }}">
{%- include head.html -%}
<body>
  {%- include header.html -%}

  <main class="page-content" aria-label="İçerik">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  {%- include footer.html -%}

  <script>
    (function () {
      var colors = { light: '#fbfbfa', sepia: '#f4ecd8', gray: '#2b2d31', dark: '#0d1117' };
      var root = document.documentElement;
      var meta = document.querySelector('meta[name="theme-color"]');
      var buttons = document.querySelectorAll('.theme-dot');
      function mark() {
        var cur = root.getAttribute('data-theme');
        buttons.forEach(function (b) {
          b.setAttribute('aria-pressed', b.getAttribute('data-theme-choice') === cur ? 'true' : 'false');
        });
      }
      buttons.forEach(function (b) {
        b.addEventListener('click', function () {
          var t = b.getAttribute('data-theme-choice');
          root.setAttribute('data-theme', t);
          if (meta) meta.setAttribute('content', colors[t]);
          try { localStorage.setItem('theme', t); } catch (e) {}
          mark();
        });
      });
      mark();
    })();
  </script>
</body>
</html>
