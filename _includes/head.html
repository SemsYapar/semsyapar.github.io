<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  {%- seo -%}
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  {%- feed_meta -%}
  <meta name="theme-color" content="#0d1117">
  <script>
    /* Sayfa çizilmeden önce temayı seç: kayıtlı tercih > sistem tercihi > gece */
    (function () {
      var colors = { light: '#fbfbfa', sepia: '#f4ecd8', gray: '#2b2d31', dark: '#0d1117' };
      var t;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!colors[t]) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', colors[t]);
    })();
  </script>
</head>
