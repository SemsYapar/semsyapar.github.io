<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>

    <nav class="site-nav">
      {%- for path in site.header_pages -%}
        {%- assign p = site.pages | where: "path", path | first -%}
        {%- if p.title -%}
          <a class="page-link" href="{{ p.url | relative_url }}">{{ p.title | escape }}</a>
        {%- endif -%}
      {%- endfor -%}
      <button class="theme-toggle" type="button" aria-label="Temayı değiştir" title="Açık / koyu tema"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </nav>
  </div>
</header>
