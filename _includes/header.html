<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>

    <nav class="site-nav">
      {%- for path in site.header_pages -%}
        {%- assign p = site.pages | where: "path", path | first -%}
        {%- if p.title -%}
          <a class="page-link" href="{{ p.url | relative_url }}">{{ p.title | escape }}</a>
        {%- endif -%}
      {%- endfor -%}
      <div class="theme-picker" role="group" aria-label="Okuma teması">
        <button class="theme-dot" type="button" data-theme-choice="light" aria-label="Gün teması" title="Gün" aria-pressed="false"></button>
        <button class="theme-dot" type="button" data-theme-choice="sepia" aria-label="Kâğıt teması" title="Kâğıt" aria-pressed="false"></button>
        <button class="theme-dot" type="button" data-theme-choice="gray" aria-label="Gri teması" title="Gri" aria-pressed="false"></button>
        <button class="theme-dot" type="button" data-theme-choice="dark" aria-label="Gece teması" title="Gece" aria-pressed="false"></button>
      </div>
    </nav>
  </div>
</header>
