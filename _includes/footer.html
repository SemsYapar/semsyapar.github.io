<footer class="site-footer">
  <div class="wrapper">
    <p class="footer-desc">{{ site.description | escape }}</p>
    {%- if site.links -%}
    <ul class="footer-links">
      {%- for l in site.links -%}
      <li><a href="{{ l.url }}" rel="me">{{ l.name | escape }}</a></li>
      {%- endfor -%}
    </ul>
    {%- endif -%}
  </div>
</footer>
